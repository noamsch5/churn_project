[project]
name = "credit-card-churn-intelligence"
version = "1.0.0"
description = "Credit-card churn prediction and customer segmentation dashboard"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pandas==2.3.3",
    "numpy==2.3.5",
    "scipy==1.16.3",
    "statsmodels==0.14.5",
    "scikit-learn==1.7.2",
    "joblib==1.5.2",
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "pydantic==2.12.4",
    "pydantic-settings==2.12.0",
    "httpx==0.28.1",
    "pytest==8.4.2",
    "matplotlib==3.10.6",
    "seaborn==0.13.2",
    "plotly==6.3.0",
    "nbformat==5.10.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.vercel]
entrypoint = "api.main:app"
